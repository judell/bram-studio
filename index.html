<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bram Studio</title>
    <!-- Dictation: Bram's script (judell/bram#417), served by Bram's built-in
         server, then Studio's bridge to it. Both must load before the engine,
         which only sees page functions that exist when it starts. -->
    <!-- Where this checkout's Studio server is (per-checkout-server-port):
         serve_media.py picks 8765 or the next free port and records it in
         studio-port.json at the repo root, which Bram's server serves beside
         this page. Read synchronously, before anything else, so every URL in
         the markup ({window.STUDIO_API}/...) has it from the first render.
         No file (the server's never run here) means 8765. The welcome
         probe calls studioReadApi() again while the server is down and
         reloads the page if a newly started server chose another port. -->
    <!-- The load-time read is timed (page-load-port-fetch-timing): one
         2026-11-15 load sat blank 23 s, this request reaching Bram that long
         after it was sent. __studioPortTiming goes to serve_media.log once
         the server answers (Main.xmlui's probe), to tell a browser hold-up
         from Bram's server against Bram's self-probe. -->
    <script>
      window.studioReadApi = function (timing) {
        var started = Date.now();
        var status = "error";
        try {
          var x = new XMLHttpRequest();
          x.open("GET", "/studio-port.json?t=" + started, false);
          x.send();
          status = x.status;
          if (x.status === 200) {
            var port = JSON.parse(x.responseText).port;
            if (port) return "http://127.0.0.1:" + port;
          }
        } catch (e) {
        } finally {
          if (timing) {
            window.__studioPortTiming = {
              sentAt: new Date(started).toISOString(), ms: Date.now() - started, status: status
            };
          }
        }
        return "http://127.0.0.1:8765";
      };
      window.STUDIO_API = window.studioReadApi(true);
    </script>
    <script src="/__shell/dictation.js"></script>
    <script src="/studio-dictation.js"></script>
    <!-- The staged-turn doorway (Bram 3ee7cb7b): the welcome face's Get me
         going asks Bram to come forward with the repo's get-me-going prompt
         staged in the message box. BramDoorway.stage() is a promise, and the
         engine's script runtime doesn't see assignments made inside native
         promise callbacks (the probeServer lesson), so the outcome is
         recorded on window and Main.xmlui polls it with a short Timer. On an
         older Bram this script 404s, BramDoorway is undefined, and the page
         falls back to the clipboard. -->
    <!-- Temporary measurement (manage-blurb-width): the Manage page's
         category descriptions wrap at about a third of their row, and two
         markup fixes didn't change it. Once per load, when a Manage page is
         showing, log the "Undo history" row's description (that row always
         shows) and its ancestors (width,
         display, flex, max-width) and the row's columns to serve_media.log
         as "podcast-page: manage-widths …", so the fix comes from evidence.
         Remove with the fix. -->
    <script>
      (function () {
        var tries = 0;
        var timer = setInterval(function () {
          if (++tries > 120) return clearInterval(timer);
          var nodes = document.querySelectorAll("body *");
          var el = null;
          for (var i = 0; i < nodes.length; i++) {
            if (nodes[i].childElementCount === 0 && /^what the History tab can still restore/.test(nodes[i].textContent || "")) {
              el = nodes[i];
              break;
            }
          }
          if (!el || !window.STUDIO_API) return;
          clearInterval(timer);
          var chain = [];
          for (var n = el, k = 0; n && k < 7; n = n.parentElement, k++) {
            var cs = getComputedStyle(n);
            chain.push({ tag: n.tagName, cls: (n.className && String(n.className).split(" ")[0]) || "",
                         w: n.offsetWidth, display: cs.display, flex: cs.flex, width: cs.width,
                         maxW: cs.maxWidth, kids: n.childElementCount });
          }
          var row = el.parentElement;
          var cols = [];
          for (var c = row && row.firstElementChild; c; c = c.nextElementSibling) {
            var s = getComputedStyle(c);
            cols.push({ w: c.offsetWidth, flex: s.flex, width: s.width, maxW: s.maxWidth,
                        text: (c.textContent || "").slice(0, 20) });
          }
          fetch(window.STUDIO_API + "/podcast/log", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ev: "manage-widths", viewport: innerWidth, chain: chain, cols: cols })
          }).catch(function () {});
        }, 1000);
      })();
    </script>
    <script src="/__shell/doorway.js"></script>
    <script>
      window.studioDoorway = function () {
        window.__doorwayOutcome = "pending";
        try {
          if (!window.BramDoorway) { window.__doorwayOutcome = "rejected"; return; }
          window.BramDoorway.stage("get-me-going").then(
            function () { window.__doorwayOutcome = "ok"; },
            function () { window.__doorwayOutcome = "rejected"; }
          );
        } catch (e) { window.__doorwayOutcome = "rejected"; }
      };
    </script>
    <!-- The page's measure of itself, for Main.xmlui's page-health Timer
         (logged by serve_media.py's /page/health). It reads the browser
         outside the app, so it lives here; it must exist before the engine
         starts. heapMB is Chrome/WebKit's performance.memory, else null. -->
    <script>
      window.studioPageHealth = function () {
        const mem = performance.memory;
        return {
          uptimeS: Math.round(performance.now() / 1000),
          heapMB: mem ? Math.round(mem.usedJSHeapSize / 1048576) : null,
          videos: document.getElementsByTagName("video").length,
          nodes: document.getElementsByTagName("*").length,
        };
      };
    </script>
    <!-- XMLUI build with render:pass trace events plus xmlui-org/xmlui#3941 candidate 4, which includes candidates 1-3 (a3429e8 + 47c7d3a + 3c100b0 + candidate 2's patch 6aec1cbb…ecb9 + candidate 3's patch a7a1bd1f…86ce; sha256 e4ec32fc…5aaf); revert to /__vendor/xmlui-standalone.umd.js for Bram's copy. -->
    <script src="/vendor/xmlui-standalone.umd.js"></script>
    <!-- xmlui-dnd-list extension (DndItems), Bram's vendored copy; must load after
         the engine, which it registers itself with. -->
    <script src="/vendor/xmlui-dnd-list.js"></script>
  </head>
  <body></body>
</html>
