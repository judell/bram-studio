<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bram Studio</title>
    <!-- Dictation: Bram's script (judell/bram#417), served by Bram's built-in
         server, then Studio's bridge to it. Both must load before the engine,
         which only sees page functions that exist when it starts. -->
    <!-- Where this checkout's Studio server is (per-checkout-server-port):
         serve_media.py picks 8765 or the next free port and records it in
         studio-port.json at the repo root, which Bram's server serves beside
         this page. Read synchronously, before anything else, so every URL in
         the markup ({window.STUDIO_API}/...) has it from the first render.
         No file (the server's never run here) means 8765. The welcome
         probe calls studioReadApi() again while the server is down and
         reloads the page if a newly started server chose another port. -->
    <!-- The load-time read is timed (page-load-port-fetch-timing): one
         2026-11-15 load sat blank 23 s, this request reaching Bram that long
         after it was sent. __studioPortTiming goes to serve_media.log once
         the server answers (Main.xmlui's probe), to tell a browser hold-up
         from Bram's server against Bram's self-probe. -->
    <script>
      window.studioReadApi = function (timing) {
        var started = Date.now();
        var status = "error";
        try {
          var x = new XMLHttpRequest();
          x.open("GET", "/studio-port.json?t=" + started, false);
          x.send();
          status = x.status;
          if (x.status === 200) {
            var port = JSON.parse(x.responseText).port;
            if (port) return "http://127.0.0.1:" + port;
          }
        } catch (e) {
        } finally {
          if (timing) {
            window.__studioPortTiming = {
              sentAt: new Date(started).toISOString(), ms: Date.now() - started, status: status
            };
          }
        }
        return "http://127.0.0.1:8765";
      };
      window.STUDIO_API = window.studioReadApi(true);
    </script>
    <script src="/__shell/dictation.js"></script>
    <script src="/studio-dictation.js"></script>
    <!-- The staged-turn doorway (Bram 3ee7cb7b): the welcome face's Get me
         going asks Bram to come forward with the repo's get-me-going prompt
         staged in the message box. BramDoorway.stage() is a promise, and the
         engine's script runtime doesn't see assignments made inside native
         promise callbacks (the probeServer lesson), so the outcome is
         recorded on window and Main.xmlui polls it with a short Timer. On an
         older Bram this script 404s, BramDoorway is undefined, and the page
         falls back to the clipboard. -->
    <script src="/__shell/doorway.js"></script>
    <script>
      window.studioDoorway = function () {
        window.__doorwayOutcome = "pending";
        try {
          if (!window.BramDoorway) { window.__doorwayOutcome = "rejected"; return; }
          window.BramDoorway.stage("get-me-going").then(
            function () { window.__doorwayOutcome = "ok"; },
            function () { window.__doorwayOutcome = "rejected"; }
          );
        } catch (e) { window.__doorwayOutcome = "rejected"; }
      };
    </script>
    <!-- Find in the long views (find-in-long-views). The Final transcript,
         Workspace and Raw transcript lists draw only the rows near the
         screen, so the browser's find misses the rest; each view has a
         FindBar (components/FindBar.xmlui, from Bram) that searches the
         data instead. studioFindPlan(rows, needle, cursor, field, keyField,
         cacheId) is the find plan from XMLUI's how-to "Find in page across a
         List" (xmlui-org/xmlui#3713): it counts occurrences of the needle in
         each row's field, not rows, and maps the one cursor to a row and an
         occurrence in it. It counts the way Text's highlightText marks (one
         trimmed term, case-insensitive, left to right, no overlaps, at least
         2 characters), so highlightActiveIndex lands on the counted one.
         Counts are cached per cacheId until the rows or the needle change,
         so a step only walks the counts. Pure: no DOM.
         Returns { total, cursor, activeRow, activeKey, activeOcc, hits }
         (hits: row key -> count). studioFindWordHit(w, needle) says whether
         a Samples-mode word chip belongs to a match: the word contains the
         needle, or is one of a phrase needle's words. -->
    <script>
      window.studioFindPlan = function (rows, needle, cursor, field, keyField, cacheId) {
        var q = String(needle || "").trim().toLowerCase();
        var arr = Array.isArray(rows) ? rows : [];
        var none = { total: 0, cursor: 0, activeRow: -1, activeKey: null, activeOcc: -1, hits: {} };
        if (q.length < 2) return none;
        var slot = "__studioFind_" + (cacheId || "default");
        var c = window[slot];
        if (!c || c.q !== q || c.rows !== arr || c.field !== field) {
          var idx = [], counts = [], hits = {}, total = 0;
          for (var i = 0; i < arr.length; i++) {
            var s = String((arr[i] && arr[i][field]) || "").toLowerCase();
            var n = 0, at = s.indexOf(q);
            while (at >= 0) { n++; at = s.indexOf(q, at + q.length); }
            if (n) { idx.push(i); counts.push(n); hits[String(arr[i][keyField])] = n; total += n; }
          }
          c = { q: q, rows: arr, field: field, idx: idx, counts: counts, hits: hits, total: total };
          window[slot] = c;
        }
        if (!c.total) return none;
        var cur = (((Number(cursor) || 0) % c.total) + c.total) % c.total;
        var acc = 0;
        for (var k = 0; k < c.counts.length; k++) {
          if (cur < acc + c.counts[k]) {
            var row = c.idx[k];
            return { total: c.total, cursor: cur, activeRow: row, activeKey: arr[row][keyField],
                     activeOcc: cur - acc, hits: c.hits };
          }
          acc += c.counts[k];
        }
        return none;
      };
      window.studioFindWordHit = function (w, needle) {
        var strip = function (s) { return String(s || "").toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""); };
        var q = String(needle || "").trim().toLowerCase();
        var x = strip(w);
        if (q.length < 2 || !x) return false;
        if (x.indexOf(q) >= 0) return true;
        var words = q.split(/\s+/).map(strip).filter(Boolean);
        return words.length > 1 && words.indexOf(x) >= 0;
      };
    </script>
    <!-- The page's measure of itself, for Main.xmlui's page-health Timer
         (logged by serve_media.py's /page/health). It reads the browser
         outside the app, so it lives here; it must exist before the engine
         starts. heapMB is Chrome/WebKit's performance.memory, else null. -->
    <script>
      window.studioPageHealth = function () {
        const mem = performance.memory;
        return {
          uptimeS: Math.round(performance.now() / 1000),
          heapMB: mem ? Math.round(mem.usedJSHeapSize / 1048576) : null,
          videos: document.getElementsByTagName("video").length,
          nodes: document.getElementsByTagName("*").length,
        };
      };
    </script>
    <!-- Podcast page, Samples switch: turning Samples on or off lays the
         words out differently, so card heights change and the list jumps.
         studioMarkCard(para) records where a paragraph card sits (the
         selected one, or with para null the topmost one in view) and
         returns the paragraph marked; studioPlaceCard(para), called when
         the list reports its visible range, scrolls the card back to that
         spot, or reports it isn't drawn so Podcast.xmlui scrolls to it by
         index and tries again. Podcast.xmlui logs each step
         (podcast-page: samples-hold) to serve_media.log.
         WORKAROUNDS: these helpers and studioAlignTop below reach into the
         DOM (rows by data-automation-id, the scroller's scrollTop), which
         isn't the XMLUI way. They stand in for a List API to place a row
         on screen, asked as xmlui-org/xmlui#3961, and are retired by the
         worklist item reminder-retire-dom-scroll-workarounds. -->
    <script>
      (function () {
        var mark = null;
        function cards() {
          return Array.prototype.slice.call(
            document.querySelectorAll('[data-automation-id*="para-card-"]'));
        }
        function paraOf(el) {
          var m = /para-card-(\d+)/.exec(el.getAttribute("data-automation-id") || "");
          return m ? Number(m[1]) : null;
        }
        function scroller(el) {
          for (var p = el.parentElement; p; p = p.parentElement) {
            var oy = getComputedStyle(p).overflowY;
            if ((oy === "auto" || oy === "scroll") && p.scrollHeight > p.clientHeight) return p;
          }
          return document.scrollingElement;
        }
        window.studioMarkCard = function (para) {
          mark = null;
          var all = cards(), el = null;
          if (para !== null && para !== undefined) {
            el = all.find(function (c) { return paraOf(c) === para; }) || null;
          }
          if (!el) {
            // None selected (or it isn't drawn): the topmost card in view.
            var sc = all.length ? scroller(all[0]) : null;
            var top = sc && sc !== document.scrollingElement ? sc.getBoundingClientRect().top : 0;
            el = all.find(function (c) { return c.getBoundingClientRect().bottom > top; }) || null;
          }
          if (el) {
            var b = el.getBoundingClientRect();
            mark = { para: paraOf(el), top: b.top, height: b.height };
          }
          return mark ? mark.para : null;
        };
        // Called from the list's visibleRangeDidChange (samples-toggle-
        // holds-after-jump), not after a timed wait: if the marked card is
        // drawn, scroll so it sits where it was marked. Returns {found,
        // moved}. The mark is kept (samples-hold-until-settled): range reports
        // arrive late and overlap, so placing is repeated on each report,
        // and Podcast.xmlui forgets the mark once a placement barely moves it.
        window.studioPlaceCard = function (para) {
          if (!mark || mark.para !== para) return { found: false, moved: null, rerendered: false };
          var el = cards().find(function (c) { return paraOf(c) === para; });
          if (!el) return { found: false, moved: null, rerendered: false };
          var b = el.getBoundingClientRect();
          var moved = b.top - mark.top;
          scroller(el).scrollTop += moved;
          // The Samples layout changes the card's height: a different height
          // means this report came after the re-render, not before it.
          return { found: true, moved: Math.round(moved), rerendered: Math.abs(b.height - mark.height) > 1 };
        };
        window.studioForgetCard = function () { mark = null; };
        // Final transcript (final-transcript-align-top-workaround; see
        // WORKAROUNDS above, xmlui-org/xmlui#3961): List.scrollToIndex places
        // rows by estimated heights and takes no alignment, so a target can
        // land mid-row. Called when the list reports its visible range (rows
        // are drawn): the row whose automation id is prefix+n gets its top
        // aligned with its scroller's top. Returns {found, delta}: delta is
        // how far off the row's top was, in px, before the correction.
        window.studioAlignTop = function (prefix, n) {
          var re = new RegExp("(^|[^a-z-])" + prefix + n + "$");
          var el = Array.prototype.slice.call(
            document.querySelectorAll('[data-automation-id*="' + prefix + '"]'))
            .find(function (c) { return re.test(c.getAttribute("data-automation-id") || ""); });
          if (!el) return { found: false, delta: null };
          var sc = scroller(el);
          var top = sc === document.scrollingElement ? 0 : sc.getBoundingClientRect().top;
          var delta = el.getBoundingClientRect().top - top;
          sc.scrollTop += delta;
          return { found: true, delta: Math.round(delta) };
        };
      })();
    </script>
    <!-- XMLUI build with render:pass trace events plus xmlui-org/xmlui#3941 candidate 4, which includes candidates 1-3 (a3429e8 + 47c7d3a + 3c100b0 + candidate 2's patch 6aec1cbb…ecb9 + candidate 3's patch a7a1bd1f…86ce; sha256 e4ec32fc…5aaf); revert to /__vendor/xmlui-standalone.umd.js for Bram's copy. -->
    <script src="/vendor/xmlui-standalone.umd.js"></script>
    <!-- xmlui-dnd-list extension (DndItems), Bram's vendored copy; must load after
         the engine, which it registers itself with. -->
    <script src="/vendor/xmlui-dnd-list.js"></script>
  </head>
  <body></body>
</html>
